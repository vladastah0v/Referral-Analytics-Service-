x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment: &app-env
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    APP_ENV: ${APP_ENV:-development}
    JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-jwt-secret-before-deployment}
    JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
    JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-30}
    DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://referral:local-development-only@postgres:5432/referral_analytics}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ANALYTICS_CACHE_TTL_SECONDS: ${ANALYTICS_CACHE_TTL_SECONDS:-60}
    ANALYTICS_CACHE_NAMESPACE: ${ANALYTICS_CACHE_NAMESPACE:-referral-analytics}
    CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  init: true

services:
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
  celery-worker:
    <<: *app
    environment:
      <<: *app-env
      CELERY_METRICS_HOST: 0.0.0.0
      CELERY_METRICS_PORT: "9101"
    tmpfs:
      - /tmp:mode=1777,size=64m
    command:
      - sh
      - -ec
      - |
        export PROMETHEUS_MULTIPROC_DIR="$$(mktemp -d /tmp/referral-prometheus.XXXXXX)"
        exec celery --quiet -A app.workers.celery_app:celery_app worker --loglevel="$$LOG_LEVEL"
  celery-beat:
    <<: *app
    command:
      - sh
      - -ec
      - exec celery --quiet -A app.workers.celery_app:celery_app beat --loglevel="$$LOG_LEVEL" --schedule=/tmp/celerybeat-schedule
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-referral_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-referral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [monitoring]
    depends_on:
      - api
      - celery-worker
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.4.12
    profiles: [monitoring]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-monitoring-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:
