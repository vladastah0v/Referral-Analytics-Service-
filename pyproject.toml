[project]
name = "referral-analytics-service"
version = "0.1.0"
description = "Referral tracking and analytics service"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.28,<1.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic-settings>=2.7,<3.0",
    "redis>=5.2,<7.0",
    "celery[redis]>=5.4,<6.0",
    "argon2-cffi>=23.1,<26",
    "pyjwt>=2.10,<3",
    "email-validator>=2.2,<3",
    "prometheus-client>=0.22,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.9,<1.0",
]
performance = [
    "locust>=2.43,<3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
concurrency = ["thread", "greenlet"]
