name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://ci:ci-local@127.0.0.1:5432/test_referral_ci
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci-local@127.0.0.1:5432/test_referral_ci
      TEST_REDIS_URL: redis://127.0.0.1:6379/14
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-local
          POSTGRES_DB: test_referral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d test_referral_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --group performance

      - name: Run Ruff
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Apply and verify Alembic migrations
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check

      - name: Run tests and enforce coverage
        run: uv run --locked pytest --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Build and smoke-test the Compose stack
        env:
          COMPOSE_PROJECT_NAME: referral-ci-smoke
          DATABASE_URL: postgresql+asyncpg://referral:local-development-only@postgres:5432/referral_analytics
        run: |
          trap 'docker compose down -v' EXIT
          docker compose build api celery-worker celery-beat
          docker compose up -d postgres redis
          docker compose run --rm api alembic upgrade head
          docker compose up -d api celery-worker celery-beat
          key="$(docker compose exec -T api python -c '
          import asyncio
          from app.core.database import engine, session_factory
          from app.modules.tracking.security import create_credential

          async def main():
              async with session_factory() as session:
                  _, key = await create_credential(session, "ci-smoke")
                  print(key)
              await engine.dispose()

          asyncio.run(main())
          ')"
          printf '%s\n' "$key" | uv run --locked python tests/smoke_compose.py
